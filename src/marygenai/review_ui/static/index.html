<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MaryGenAI Review</title>
    <link rel="stylesheet" href="/ui/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">MaryGenAI internal review</p>
        <h1>Review queues</h1>
      </div>
      <div id="api-status" class="status-pill">Checking API</div>
    </header>

    <main class="workspace">
      <section class="panel queue-panel" aria-labelledby="queue-heading">
        <div class="panel-heading">
          <h2 id="queue-heading">Queues</h2>
          <button id="refresh-button" type="button">Refresh</button>
        </div>
        <div class="queue-controls">
          <label>
            Queue
            <select id="queue-select">
              <option value="legacy_identity_review">Legacy identity review</option>
              <option value="publication_candidate_review">Publication candidate review</option>
            </select>
          </label>
          <label>
            Quick filter
            <select id="filter-select">
              <option value="">All open items</option>
              <option value="identity_status:needs_manual_identity_review">
                Needs manual identity review
              </option>
              <option value="identity_status:new_candidate">New candidate</option>
              <option value="priority_tier:direct_title_or_indexed">
                Direct title or indexed
              </option>
              <option value="full_text_review_priority:high_auto_full_text">
                High auto full text
              </option>
              <option value="full_text_review_priority:high_manual_full_text">
                High manual full text
              </option>
            </select>
          </label>
        </div>
        <div id="queue-summary" class="queue-summary"></div>
        <h3 id="open-items-heading">Open items</h3>
        <div id="review-list" class="review-list" aria-live="polite"></div>
      </section>

      <section class="panel detail-panel" aria-labelledby="detail-heading">
        <div class="panel-heading">
          <h2 id="detail-heading">Publication detail</h2>
          <span id="selected-item-label" class="muted">No item selected</span>
        </div>
        <div id="detail-content" class="detail-empty">
          Select an open review item to inspect publication metadata, review signals,
          provenance, and workflow status.
        </div>
      </section>
    </main>

    <script src="/ui/static/app.js" defer></script>
  </body>
</html>
