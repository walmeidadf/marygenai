[project]
name = "marygenai"
version = "0.1.0"
description = "Scientific source intelligence and candidate classification for cannabinoid medicine."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.2.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.0",
    "lxml>=5.3.0",
    "mangum>=0.19,<1",
    "mcp>=1.27,<2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
    "typer>=0.15.0",
    "uvicorn>=0.47.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[project.scripts]
marygenai = "marygenai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
